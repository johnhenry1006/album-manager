# HOCON configuration loaded by S3 Ninja's runtime from /home/sirius/instance.conf.
# Required environment substitutions override the image's example credentials.
storage {
  awsAccessKey = ${S3_ACCESS_KEY}
  awsSecretKey = ${S3_SECRET_KEY}
  baseDir = "/home/sirius/data"
  multipartDir = "/home/sirius/multipart"
  autocreateBuckets = false
}

# Native allow-all CORS omits HEAD from preflight methods. Keep it disabled;
# the public-endpoint proxy handles origin-specific PUT/GET/HEAD CORS instead.
http.corsAllowAll = ${S3_CORS_ALLOW_ALL}
